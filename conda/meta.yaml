package:
  name: {{ environ.get('CONDA_PKG') }}
  version: {{ environ.get('CONDA_PKG_VERSION') }}

source:
    path: ..

build:
    number: 0

requirements:
    build:
        - {{ compiler('cxx') }}
        - make
        - cmake
    host:
        - libgrpc
        - libprotobuf
        - zlib
        - llvm-openmp  # [osx]
    # libgrpc, libprotobuf etc. add the matching run requirements themselves

test:
    commands:
        - kraken2_server --help
        - kraken2_client --help

about:
    home: "https://github.com/epi2me-labs/fastcat"
    license: MIT 
    license_family: MIT
    license_file: LICENSE
    summary: "Server implementation of kraken2"
    doc_url: https://github.com/epi2me-labs/kraken2
    dev_url: https://github.com/epi2me-labs/kraken2 

extra:
    recipe-maintainers:
        - cjw85
