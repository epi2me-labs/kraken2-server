include:
    - project: "epi2melabs/ci-templates"
      file:
          - "push-github.yaml"
          - "push-conda.yaml"
          - "snippets.yaml"
          - ".eks-tags.yaml"

image: ${UBUNTUIMAGE}:22.04

# Use branch pipelines rather than merge request pipelines: without this gate
# GitLab creates both for the same commit when included templates make MR jobs
# eligible.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

default:
  tags: !reference [.eks-small-standard-tags, tags]

variables:
    GIT_SUBMODULE_STRATEGY: recursive

stages:
    - prerelease
    - test
    - package
    - release

# Test (UPLOAD: "no") conda packages are built automatically on dev, and can be
# started by hand from the pipeline on any other branch.
.package-rules: &package-rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null'
      allow_failure: true


deploy-checks:
    stage: prerelease
    script:
        - !reference [.check, changelog]
        - !reference [.check, license]
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'


# Build with gRPC and protobuf from conda-forge packages and run all the checks
# against upstream kraken2's `classify`, on small synthetic databases that the
# checks generate themselves. Runs on every push.
test:
    stage: test
    variables:
        MINICONDA_VERSION: "24.9.2-0"
    script:
        - MINICONDA_LOCATION=$(mktemp -d)/miniconda
        - !reference [.install, mamba]
        - mamba create -y -n k2 -c conda-forge --override-channels libgrpc libprotobuf zlib cmake cxx-compiler make python
        - mamba activate k2
        # kraken2-server
        - cmake -S . -B build/kraken2-server -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${CONDA_PREFIX}
        - cmake --build build/kraken2-server -j $(nproc)
        # upstream kraken2, for the reference `classify` and for `build_db`
        - cmake -S third_party/kraken2 -B build/kraken2 -DCMAKE_BUILD_TYPE=Release
        - cmake --build build/kraken2 -j $(nproc) --target classify build_db
        - tests/integration/run_all_checks.sh build/kraken2-server build/kraken2/src/classify build/kraken2/src/build_db


.before-script: &before-script |
    export CONDA_PKG=${CI_PROJECT_NAME}
    VERSION="0.0.0"
    if [[ -n "${CI_COMMIT_TAG}" ]]; then VERSION=${CI_COMMIT_TAG/v}; fi
    export CONDA_PKG_VERSION="${VERSION}"
    cd conda


# Release packages: built and uploaded when a version tag is pushed.
conda-linux-x86:
    extends: .deploy-conda
    before_script:
        - *before-script

conda-linux-arm64:
    extends: .deploy-conda-linux-arm
    before_script:
        - *before-script

conda-mac-arm:
    extends: .deploy-conda-mac-arm
    before_script:
        - *before-script


# Test packages: the same builds, but with UPLOAD "no" so nothing is pushed.
test-conda-linux-x86:
    stage: package
    extends: .deploy-conda
    variables:
        UPLOAD: "no"
    before_script:
        - *before-script
    rules: *package-rules

test-conda-linux-arm64:
    stage: package
    extends: .deploy-conda-linux-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *before-script
    rules: *package-rules

test-conda-mac-arm:
    stage: package
    extends: .deploy-conda-mac-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *before-script
    rules: *package-rules
